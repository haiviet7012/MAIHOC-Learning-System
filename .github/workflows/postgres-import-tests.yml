name: PostgreSQL import helper tests

on:
  pull_request:
    paths:
      - "server/migrate-sqlite-to-postgres.js"
      - "server/tests/**"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/postgres-import-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/migrate-sqlite-to-postgres.js"
      - "server/tests/**"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/postgres-import-tests.yml"

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Test SQLite to PostgreSQL conversion helpers
        working-directory: server
        run: npm run test:postgres-import
      - name: Test cleanup safety guardrails
        working-directory: server
        run: npm run test:cleanup
