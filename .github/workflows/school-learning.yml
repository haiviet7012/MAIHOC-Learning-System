name: School and Learning regression
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: maihoc_test
          POSTGRES_DB: maihoc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix server --ignore-scripts
      - run: npm test
      - run: node --test server/tests/platform-foundation.test.js server/tests/postgres-runtime.test.js
      - run: node --test server/tests/timetable.test.js
      - name: PostgreSQL migration and domain integration
        run: npm run test:platform
        env:
          MAIHOC_TEST_DATABASE_URL: postgresql://postgres:maihoc_test@localhost:5432/maihoc_test
      - run: npm run build && npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:learning
      - run: npm run test:advisor
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maihoc-browser-verification
          path: test-results/
