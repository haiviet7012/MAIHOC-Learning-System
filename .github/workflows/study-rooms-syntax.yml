name: Study Rooms syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check server modules
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/chat.js
          node --check server/check-postgres-auth.js
          node --check server/tests-module/index.js
          node --check server/study-rooms/server.js
          node --check server/grading/engine.js
          node --test tests/grading-config.test.js
      - name: Check browser modules
        run: |
          node --input-type=module --check < js/app.js
          node --input-type=module --check < study-rooms/client.js
